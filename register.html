<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102C48">
  <title>Create Account | Mavuno Credit</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-wrapper {
      min-height: 80vh;
      padding: 55px 20px;
      background: #F5F7FA;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-card {
      background: white;
      padding: 35px;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 30px rgba(0,0,0,.06);
    }

    .auth-heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-heading h1 {
      color: #102C48;
      font-size: 28px;
    }

    .auth-heading p {
      color: #718096;
      font-size: 14px;
      margin-top: 7px;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 17px;
    }

    .auth-form label {
      font-size: 13px;
      font-weight: 600;
      color: #263445;
    }

    .auth-form input {
      width: 100%;
      padding: 13px;
      border: 1px solid #DCE2E9;
      border-radius: 6px;
      outline: none;
      font-size: 14px;
      margin-top: 7px;
    }

    .auth-form input:focus {
      border-color: #B18A3F;
    }

    .auth-form button {
      width: 100%;
      border: none;
    }

    .auth-bottom {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #718096;
    }

    .auth-bottom a {
      color: #A57C2D;
      font-weight: bold;
    }

    .auth-message {
      font-size: 13px;
      font-weight: 600;
    }

    .auth-consent {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 12px;
      color: #718096;
    }

    .auth-consent input {
      width: auto;
      margin-top: 3px;
    }
  </style>
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">
    <span>MAVUNO</span>
    <small>CREDIT</small>
  </a>
  <button class="menu-toggle" id="menuToggle">☰</button>
  <nav id="navigation">
    <a href="index.html">Home</a>
    <a href="apply.html">Apply for Loan</a>
    <a href="login.html" class="login-link">Login</a>
  </nav>
</header>

<main class="auth-wrapper">

  <div class="auth-card">

    <div class="auth-heading">
      <span class="eyebrow">JOIN MAVUNO CREDIT</span>
      <h1>Create Your Account</h1>
      <p>Register to access our online loan services.</p>
    </div>

    <form class="auth-form" id="registerForm">

      <label>
        Full Name
        <input type="text" id="regName"
          placeholder="Enter your full name"
          maxlength="150" required>
      </label>

      <label>
        Phone Number
        <input type="tel" id="regPhone"
          placeholder="07XXXXXXXX"
          pattern="(?:\+254|254|0)7[0-9]{8}|(?:\+254|254|0)1[0-9]{8}"
          required>
      </label>

      <label>
        Email Address
        <input type="email" id="regEmail"
          placeholder="Enter your email"
          maxlength="150" required>
      </label>

      <label>
        Password
        <input type="password" id="regPassword"
          placeholder="Create a password"
          minlength="12" required>
      </label>

      <label>
        Confirm Password
        <input type="password" id="confirmPassword"
          placeholder="Confirm your password"
          minlength="12" required>
      </label>

      <label class="auth-consent">
        <input type="checkbox" id="registerConsent" required>
        <span>
          I agree to the applicable Terms and Conditions
          and acknowledge the Privacy Notice.
        </span>
      </label>

      <button type="submit" class="btn btn-gold">
        Create Account →
      </button>

      <div id="registerMessage" class="auth-message"></div>

    </form>

    <div class="auth-bottom">
      Already have an account?
      <a href="login.html">Login here</a>
    </div>

  </div>

</main>

<footer class="footer">
  <div class="logo footer-logo">
    <span>MAVUNO</span>
    <small>CREDIT</small>
  </div>
  <p>Grow. Progress. Prosper.</p>
  <p class="copyright">
    © <span id="year"></span> Mavuno Credit. All rights reserved.
  </p>
</footer>

<script src="app.js"></script>
<script src="register.js"></script>
</body>
</html>
